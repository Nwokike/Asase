[project]
name = "asase"
version = "1.0.3"
description = "Asase — Global Earth Intelligence & Multi-Hazard Planetary Defense Platform"
readme = "README.md"
requires-python = ">=3.12"
# Flet family pinned exact: the audit verified every API against the
# installed source. Unpin only with a re-verification pass.
dependencies = [
    "flet==1.1.2",
    "flet-ads==1.1.2",
    "flet-map==1.1.2",
    "flet-geolocator==1.1.2",
    "httpx[http2]>=0.28.1",
    "flet-charts==1.1.2",
]

[tool.flet]
org = "ng.kiri"
product = "Asase"
company = "Kiri Research Labs"
build_number = 5

[tool.flet.app]
path = "src"

[tool.flet.app.boot_screen]
startup_message = "Initializing Asase Earth Telemetry..."

[tool.flet.web]
base_url = "/"
route_url_strategy = "path"
renderer = "canvaskit"
pwa_background_color = "#0B0F17"
pwa_theme_color = "#10B981"
# iOS Home Screen label for the installed PWA (1.0.4 honors it; the
# project name "asase" showed there before).
pwa_short_name = "Asase"
dependencies = []

[tool.flet.android]
# Family standard (ktv-player / DDGS / akili-v2 / lm-router): extract
# native libraries to disk at install time instead of memory-mapping
# them from the APK — smaller .apk for side-loading, larger on-device
# install, slower native-lib loading.
legacy_packaging = true
bundle_id = "ng.kiri.asase"

[tool.flet.android.manifest_application]
usesCleartextTraffic = "false"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
"android.permission.ACCESS_FINE_LOCATION" = true
"android.permission.ACCESS_COARSE_LOCATION" = true

[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-5679949845754640~3484587388"

[tool.flet.android.signing]
key_store = "../../../../kiri_keystore.jks"
key_alias = "upload"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = [".", "src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# M9: no test may hang CI — every test gets a hard 120s ceiling.
timeout = 120

[tool.ruff]
lint.extend-ignore = ["BLE001", "S110", "ASYNC230"]
