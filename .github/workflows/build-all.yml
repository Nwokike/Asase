name: Build Multi-Platform & Create Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Build version"
        required: true
        default: "1.0.0"
      build_number:
        description: "Build number"
        required: true
        default: "1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  UV_PYTHON: "3.14"
  BUILD_VERSION: ${{ inputs.build_version || '1.0.0' }}
  BUILD_NUMBER: ${{ inputs.build_number || '1' }}

jobs:
  # ─── 0. Run Tests & Linter ─────────────────────────────
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint and Test
        run: |
          uv sync --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -v

  # ─── 1. Create Release Tag & Placeholder ───────────────
  prepare-release:
    needs: [test-and-lint]
    runs-on: ubuntu-latest
    outputs:
      TAG_NAME: ${{ steps.tag_info.outputs.TAG_NAME }}
      RELEASE_NAME: ${{ steps.tag_info.outputs.RELEASE_NAME }}
      IS_PRERELEASE: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Release Tag & Name
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=Asase ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "TAG_NAME=build-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=Automated Build (${SHORT_SHA})" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          fi
      - name: Create GitHub Release Placeholder
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: ${{ steps.tag_info.outputs.RELEASE_NAME }}
          prerelease: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
          body_path: release_notes.md
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 2. Android APK (split per ABI: arm64-v8a, armeabi-v7a, x86_64) ──
  build-apk-split:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > kiri_keystore.jks
      - name: Build APK (split per ABI)
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: uv run flet build apk --yes --project asase --product "Asase" --org ng.kiri --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} --split-per-abi -v
      - name: Inject icon & rebuild split APKs
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/build/site-packages
        run: |
          RES=build/flutter/android/app/src/main/res
          mkdir -p "$RES/mipmap-xxxhdpi"
          cp src/assets/icon.png "$RES/mipmap-xxxhdpi/ic_launcher.png"
          (cd build/flutter/android && ./gradlew assembleRelease)
          rm -rf build/apk
          mkdir -p build/apk
          find build/flutter -name "*arm64-v8a*.apk" -not -path "*/intermediates/*" -exec cp {} build/apk/asase-arm64-v8a.apk \;
          find build/flutter -name "*armeabi-v7a*.apk" -not -path "*/intermediates/*" -exec cp {} build/apk/asase-armeabi-v7a.apk \;
          find build/flutter -name "*x86_64*.apk" -not -path "*/intermediates/*" -exec cp {} build/apk/asase-x86_64.apk \;
          # Fallback if specific ABI filename format differs
          find build/flutter -name "*.apk" -not -path "*/intermediates/*" -not -path "*/build/apk/*" -exec cp -u {} build/apk/ \;
          ls -lh build/apk/
      - name: Verify 16 KB page alignment (Google Play requirement)
        run: python scripts/check_elf_alignment.py build/apk/*.apk
      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 3. Android AAB (Play Store) ──────────────────────────
  build-aab:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install libgl1 (Linux headless graphical asset processing)
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-glx libglib2.0-0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > kiri_keystore.jks
      - name: Build AAB
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: uv run flet build aab --yes --project asase --product "Asase" --org ng.kiri --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} -v
      - name: Inject icon & rebuild AAB
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/build/site-packages
        run: |
          RES=build/flutter/android/app/src/main/res
          mkdir -p "$RES/mipmap-xxxhdpi"
          cp src/assets/icon.png "$RES/mipmap-xxxhdpi/ic_launcher.png"
          (cd build/flutter/android && ./gradlew bundleRelease)
          rm -rf build/aab
          mkdir -p build/aab
          find build/flutter -name "*.aab" -not -path "*/intermediates/*" -exec cp {} build/aab/asase-release.aab \;
          ls -lh build/aab/
      - name: Verify 16 KB page alignment (Google Play requirement)
        run: python scripts/check_elf_alignment.py build/aab/*.aab
      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/aab/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 4. Windows (Inno Setup Installer) ────────────────────
  build-windows:
    needs: [prepare-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Build Windows Portable
        run: uv run flet build windows --yes --project asase --product "Asase" --org ng.kiri --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} -v

      - name: Generate Icon for Installer
        run: |
          uv add pillow
          uv run python -c "from PIL import Image; Image.open('src/assets/icon.png').save('src/assets/icon.ico', format='ICO', sizes=[(256, 256)])"

      - name: Build Windows Installer (Inno Setup)
        run: |
          $IssContent = @"
          [Setup]
          AppId={{4F632190-7812-4C15-8E7B-771B88992A15}}
          AppName=Asase
          AppVersion=${{ env.BUILD_VERSION }}
          AppPublisher=Kiri Research Labs
          AppPublisherURL=https://kiri.ng
          AppSupportURL=https://kiri.ng/support
          AppUpdatesURL=https://kiri.ng/updates
          AppCopyright=Copyright (C) 2026 Kiri Research Labs
          DefaultDirName={autopf}\Asase
          DefaultGroupName=Asase
          OutputDir=.\build\installer
          OutputBaseFilename=Asase_Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=lowest
          SetupIconFile=.\src\assets\icon.ico
          UninstallDisplayIcon={app}\asase.exe
          CloseApplications=yes
          AppMutex=Asase_Mutex

          [Files]
          Source: "build\windows\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Asase"; Filename: "{app}\asase.exe"
          Name: "{autodesktop}\Asase"; Filename: "{app}\asase.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"; Flags: unchecked
          "@
          Set-Content -Path "installer.iss" -Value $IssContent -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/installer/Asase_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 5. Linux (.deb, .rpm & Universal .tar.gz) ────────────────
  build-linux:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Linux Build Dependencies & Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config rpm ruby ruby-dev
          sudo gem install --no-document fpm
      - name: Build Linux Bundle
        run: uv run flet build linux --yes --project asase --product "Asase" --org ng.kiri --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} -v
      - name: Create Linux Packages (.deb, .rpm, .tar.gz)
        run: |
          mkdir -p build/dist

          # 1. Universal Portable .tar.gz
          tar -czf build/dist/Asase_linux_x86_64.tar.gz -C build/linux .

          # 2. Stage filesystem tree for rich .deb and .rpm packages
          mkdir -p pkg_root/usr/lib/asase pkg_root/usr/bin pkg_root/usr/share/applications pkg_root/usr/share/icons/hicolor/256x256/apps pkg_root/usr/share/pixmaps pkg_root/usr/share/metainfo
          cp -a build/linux/* pkg_root/usr/lib/asase/
          chmod +x pkg_root/usr/lib/asase/asase
          ln -s /usr/lib/asase/asase pkg_root/usr/bin/asase

          # Icons
          cp src/assets/icon.png pkg_root/usr/share/icons/hicolor/256x256/apps/asase.png
          cp src/assets/icon.png pkg_root/usr/share/pixmaps/asase.png

          # Desktop entry
          cat <<EOF > pkg_root/usr/share/applications/asase.desktop
          [Desktop Entry]
          Version=1.0
          Name=Asase
          GenericName=Global Earth Intelligence & Hazard Radar
          Comment=Live multi-hazard planetary telemetry, seismic monitoring, atmospheric risk index and space weather
          Exec=/usr/bin/asase
          Icon=asase
          Terminal=false
          Type=Application
          Categories=Science;Geology;Weather;Utility;Education;
          Keywords=Earth;Hazards;Earthquakes;Weather;Climate;Seismic;SpaceWeather;Telemetry;
          StartupNotify=true
          StartupWMClass=asase
          EOF

          # AppStream / AppData metainfo XML
          cat <<EOF > pkg_root/usr/share/metainfo/ng.kiri.asase.metainfo.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>ng.kiri.asase</id>
            <metadata_license>MIT</metadata_license>
            <project_license>MIT</project_license>
            <name>Asase</name>
            <summary>Global Earth Intelligence & Multi-Hazard Planetary Defense Platform</summary>
            <description>
              <p>Asase provides real-time planetary telemetry and comprehensive environmental risk dossiers:</p>
              <ul>
                <li>Live USGS Earthquake monitoring with magnitude filtering and ShakeMap estimation</li>
                <li>NASA EONET active wildfire, cyclone, and volcanic hazard feeds</li>
                <li>Open-Meteo GloFAS river flood forecast and marine coastal dynamics</li>
                <li>NOAA Space Weather Prediction Center planetary geomagnetic Kp index</li>
              </ul>
            </description>
            <launchable type="desktop-id">asase.desktop</launchable>
            <url type="homepage">https://asase.kiri.ng</url>
            <developer_name>Kiri Research Labs</developer_name>
          </component>
          EOF

          # Build rich .deb using fpm
          fpm -s dir -t deb -n asase -v ${{ env.BUILD_VERSION }} --iteration ${{ env.BUILD_NUMBER }} \
              --architecture amd64 \
              --description "Global Earth Intelligence & Multi-Hazard Planetary Defense Platform." \
              --maintainer "Kiri Research Labs <support@kiri.ng>" \
              --url "https://asase.kiri.ng" \
              --category "science" \
              -p build/dist/Asase_amd64.deb \
              -C pkg_root .

          # Build rich .rpm using fpm
          fpm -s dir -t rpm -n asase -v ${{ env.BUILD_VERSION }} --iteration ${{ env.BUILD_NUMBER }} \
              --architecture x86_64 \
              --description "Global Earth Intelligence & Multi-Hazard Planetary Defense Platform." \
              --maintainer "Kiri Research Labs <support@kiri.ng>" \
              --url "https://asase.kiri.ng" \
              --category "Science" \
              -p build/dist/Asase_x86_64.rpm \
              -C pkg_root .

      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 6. Web App Build (Release Archive & Pages Staging) ──────
  build-web:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build Web App
        run: |
          uv run flet build web --yes --project asase --product "Asase" --org ng.kiri --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} --base-url "/" -v
          echo "asase.kiri.ng" > build/web/CNAME
          touch build/web/.nojekyll
          cp src/assets/favicon.png build/web/favicon.png
          cp src/assets/favicon.png build/web/icons/Icon-192.png
          cp src/assets/favicon.png build/web/icons/apple-touch-icon-192.png
          python3 -c "
          with open('build/web/index.html', 'r', encoding='utf-8') as f:
              html = f.read()
          splash_html = '''
          <div id=\"asase-splash\">
            <style>
              body {
                margin: 0;
                padding: 0;
                background-color: #0B0F17;
                overflow: hidden;
              }
              #asase-splash {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: #0B0F17;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 22px;
                z-index: 999999;
                transition: opacity 0.3s ease-out;
              }
              #asase-splash img {
                width: 80px;
                height: 80px;
                border-radius: 18px;
              }
              .asase-spinner {
                width: 26px;
                height: 26px;
                border: 2.5px solid rgba(16, 185, 129, 0.2);
                border-top-color: #10B981;
                border-radius: 50%;
                animation: asase-spin 0.8s linear infinite;
              }
              @keyframes asase-spin {
                to { transform: rotate(360deg); }
              }
              .fade-out {
                opacity: 0 !important;
                pointer-events: none;
              }
            </style>
            <img src=\"favicon.png\" alt=\"Asase\" />
            <div class=\"asase-spinner\"></div>
          </div>
          '''
          html = html.replace('<body>', '<body>' + splash_html)
          with open('build/web/index.html', 'w', encoding='utf-8') as f:
              f.write(html)

          with open('build/web/python.js', 'r', encoding='utf-8') as f:
              pjs = f.read()
          pjs = pjs.replace(
              'app.dartOnMessage(event.data);',
              '''var splash = document.getElementById(\"asase-splash\");
                      if (splash) {
                          splash.classList.add(\"fade-out\");
                          setTimeout(function() { splash.remove(); }, 350);
                      }
                      app.dartOnMessage(event.data);'''
          )
          with open('build/web/python.js', 'w', encoding='utf-8') as f:
              f.write(pjs)
          "
      - name: Package Web Release Archive
        run: |
          mkdir -p build/dist
          tar -czf build/dist/Asase_web.tar.gz -C build/web .
      - name: Upload Web Archive to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/dist/Asase_web.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

  # ─── 7. Deploy to asase.kiri.ng (GitHub Pages) ────────────────
  deploy-pages:
    needs: [build-web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
